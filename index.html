<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노래 가사 찾기</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      font-family: Arial;
      text-align: center;
    }
    body > div {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }
    .hidden { display: none; }
    .btn { margin: 10px; padding: 10px 20px; cursor: pointer; border: 1px solid #333; display: inline-block; }
    img { max-width: 100%; }
    .back {
      width: 50px;
      cursor: pointer;
      margin-top: 0;
    }
    #root,
    #songs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .root-image {
      width: min(100%, 420px);
      height: auto;
      margin: 0 0 12px;
      display: block;
    }
    .root-menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 10px 12px;
      width: min(100%, 360px);
    }
    .root-menu .btn {
      margin: 0;
      min-height: 44px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
      white-space: normal;
    }
    #root.hidden,
    #songs.hidden,
    #lyrics.hidden {
      display: none;
    }
    #songList {
      width: 100%;
    }
    #lyrics {
      height: 100vh;
      height: 100dvh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      justify-items: center;
      overflow: hidden;
    }
    #lyricsImg {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      margin-top: 0;
    }
  </style>
</head>
<body>

<!-- ROOT PAGE -->
<div id="root">
  <img src="50.jpg" alt="" class="root-image">
  <h2>72 노래방</h2>
  <div class="root-menu">
    <div class="btn" onclick="openCategory('7080a')">7080a</div>
    <div class="btn" onclick="openCategory('7080b')">7080b</div>
    <div class="btn" onclick="openCategory('7080c')">7080c</div>
    <div class="btn" onclick="openCategory('902000')">902000</div>
    <div class="btn" onclick="openCategory('외국가곡')">외국가곡</div>
    <div class="btn" onclick="openCategory('한국가곡')">한국가곡</div>
    <div class="btn" onclick="openCategory('만화영화')">만화영화 주제가</div>
    <div class="btn" onclick="openCategory('CM송')">CM송</div>
  </div>
</div>

<!-- SONG LIST PAGE -->
<div id="songs" class="hidden">
  <img src="arrow.png" class="back" onclick="goRoot()">
  <h2 id="categoryTitle"></h2>
  <div id="songList"></div>
</div>

<!-- LYRICS PAGE -->
<div id="lyrics" class="hidden">
  <img src="arrow.png" class="back" onclick="goSongs()">
  <h2 id="songTitle"></h2>
  <img id="lyricsImg" src="">
</div>

<script>
const data = {
  "7080a": [
    {name:"친구", file:"78a1.png"},
    {name:"저 별과 달을", file:"78a2.png"},
    {name:"하얀 나비", file:"78a3.png"},
    {name:"그건 너", file:"78a4.png"},
    {name:"솔개", file:"78a5.png"}
  ],
  "7080b": [
    {name:"나 어떻게", file:"78b1.png"},
    {name:"한잔의 추억", file:"78b2.png"},
    {name:"사노라면", file:"78b3.png"},
    {name:"빗속의 여인", file:"78b4.png"},
    {name:"아파트", file:"78b5.png"}
  ],
  "7080c": [
    {name:"행복의 나라로", file:"78c1.png"},
    {name:"고래 사냥", file:"78c2.png"},
    {name:"이루어질 수 없는 사랑", file:"78c3.png"},
    {name:"아침이슬", file:"78c4.png"},
    {name:"밤배", file:"78c5.png"}
  ],
  "902000": [
    {name:"준비없는 이별", file:"921.png"},
    {name:"사랑할수록", file:"922.png"},
    {name:"사람이 꽃보다 아름다워", file:"923.png"},
    {name:"걱정말아요 그대", file:"924.png"},
    {name:"봄봄봄", file:"925.png"}
  ],
  "한국가곡": [
    {name:"동무생각", file:"k1.png"},
    {name:"사공의노래", file:"k2.png"},
    {name:"떠나가는 배", file:"k3.png"},
    {name:"희망의 나라로", file:"k4.png"},
    {name:"비목", file:"k5.png"}
  ],
  "외국가곡": [
    {name:"스와니강", file:"f1.png"},
    {name:"거룩한 천사의 음성", file:"f2.png"},
    {name:"오 솔레미오", file:"f3.png"},
    {name:"보리수", file:"f4.png"},
    {name:"메기의 추억", file:"f5.png"}
  ],
  "CM송": [
    {name:"해태껌", file:"c1.png"},
    {name:"브라보 콘", file:"c2.png"},
    {name:"맛동산", file:"c3.png"},
    {name:"진로소주", file:"c4.png"},
    {name:"동요 메들리", file:"c5.png"}
  ],
  "만화영화": [
    {name:"아톰", file:"a1.png"},
    {name:"마린보이", file:"a2.png"},
    {name:"아기사자 레오", file:"a3.png"},
    {name:"황금박쥐", file:"a4.png"},
    {name:"타이거 마스크", file:"a5.png"}
  ]
};

let currentCategory = "";

function openCategory(cat) {
  currentCategory = cat;
  document.getElementById("root").classList.add("hidden");
  document.getElementById("songs").classList.remove("hidden");
  document.getElementById("categoryTitle").innerText = cat;

  const list = document.getElementById("songList");
  list.innerHTML = "";

  data[cat].forEach(song => {
    const div = document.createElement("div");
    div.className = "btn";
    div.innerText = song.name;
    div.onclick = () => openLyrics(song);
    list.appendChild(div);
  });
}

function openLyrics(song) {
  document.getElementById("songs").classList.add("hidden");
  document.getElementById("lyrics").classList.remove("hidden");

  document.getElementById("songTitle").innerText = song.name;
  document.getElementById("lyricsImg").src = song.file;
}

function goRoot() {
  document.getElementById("songs").classList.add("hidden");
  document.getElementById("root").classList.remove("hidden");
}

function goSongs() {
  document.getElementById("lyrics").classList.add("hidden");
  document.getElementById("songs").classList.remove("hidden");
}
</script>

</body>
</html>
