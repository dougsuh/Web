<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A4 3페이지 전체화면 보기</title>
  <style>
    :root {
      --frame-border: 0.35rem;
      --caption-height: 64px;
      --page-padding: 1.2rem;
      --screen-gap: 0;
      --paper-width: 210mm;
      --paper-height: 297mm;
      --paper-padding: 14mm;
      --paper-border: 0.5mm;
      --paper-radius: 4mm;
      --caption-size: 12pt;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .toolbar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.4;
      color: #f4f4f4;
    }

    .pages {
      display: flex;
      flex-direction: column;
      gap: var(--screen-gap);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      height: 100vh;
      padding: var(--page-padding);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      scroll-snap-align: start;
    }

    .image-card {
      width: 100%;
      height: 100%;
      border: var(--frame-border) solid rgba(255, 255, 255, 0.65);
      border-radius: 1rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #000;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    .image-card img {
      width: 100%;
      height: calc(100% - var(--caption-height));
      object-fit: contain;
      display: block;
      background: #000;
    }

    .caption {
      height: var(--caption-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      text-align: center;
      font-size: 1rem;
      line-height: 1.35;
      background: #fff;
      color: #111;
      border-top: 1px solid rgba(0, 0, 0, 0.18);
    }

    @media (max-width: 768px) {
      :root {
        --page-padding: 0.6rem;
        --frame-border: 0.2rem;
        --caption-height: 56px;
      }

      .toolbar {
        left: 10px;
        right: 10px;
        top: 10px;
        border-radius: 12px;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: #fff;
        color: #222;
      }

      .toolbar {
        display: none;
      }

      .pages {
        display: block;
      }

      .page {
        width: var(--paper-width);
        height: var(--paper-height);
        min-height: var(--paper-height);
        padding: var(--paper-padding);
        margin: 0;
        display: flex;
        background: #fff;
        break-after: page;
      }

      .page:last-child {
        break-after: auto;
      }

      .image-card {
        width: 100%;
        height: 100%;
        border: var(--paper-border) solid #666;
        border-radius: var(--paper-radius);
        box-shadow: none;
        background: #fafafa;
      }

      .image-card img {
        height: auto;
        flex: 1;
        min-height: 0;
        object-fit: contain;
        background: #fff;
      }

      .caption {
        height: auto;
        min-height: auto;
        padding: 5mm;
        font-size: var(--caption-size);
        color: #222;
        background: #fff;
        border-top: var(--paper-border) solid #999;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    화면에서는 각 페이지가 전체 화면을 채우고, 인쇄하면 A4 3페이지로 출력됩니다.
  </div>

  <main class="pages">
    <section class="page">
      <article class="image-card">
        <img src="./c.png" alt="1페이지 그림" />
        <div class="caption">1페이지 그림 설명</div>
      </article>
    </section>

    <section class="page">
      <article class="image-card">
        <img src="./a.png" alt="2페이지 그림" />
        <div class="caption">2페이지 그림 설명</div>
      </article>
    </section>

    <section class="page">
      <article class="image-card">
        <img src="./b.png" alt="3페이지 그림" />
        <div class="caption">3페이지 그림 설명</div>
      </article>
    </section>
  </main>
</body>
</html>
