<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A4 3페이지 세로 배치</title>
  <style>
    :root {
      --page-width: 210mm;
      --page-height: 297mm;
      --page-padding: 14mm;
      --frame-border: 0.5mm;
      --frame-radius: 4mm;
      --caption-size: 12pt;
      --stack-gap: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eceff1;
      color: #222;
    }

    .toolbar {
      max-width: 980px;
      margin: 22px auto 10px;
      padding: 0 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #444;
    }

    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--stack-gap);
      padding-bottom: 24px;
    }

    .page {
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: var(--page-padding);
      display: flex;
      flex-direction: column;
    }

    .image-card {
      border: var(--frame-border) solid #666;
      border-radius: var(--frame-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #fafafa;
    }

    .image-card img {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: cover;
      display: block;
    }

    .caption {
      border-top: var(--frame-border) solid #999;
      padding: 5mm;
      text-align: center;
      font-size: var(--caption-size);
      line-height: 1.35;
      background: #fff;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: #fff;
      }

      .toolbar {
        display: none;
      }

      .pages {
        gap: 0;
        padding-bottom: 0;
      }

      .page {
        margin: 0;
        box-shadow: none;
        break-after: page;
      }

      .page:last-child {
        break-after: auto;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    HTML 파일과 같은 폴더에 있는 a.png, b.png, c.png를 사용하도록 설정했습니다. 인쇄하면 각 그림이 A4 한 페이지씩 출력됩니다.
  </div>

  <main class="pages">
    <section class="page">
      <article class="image-card">
        <img src="./a.png" alt="1페이지 그림" />
        <div class="caption">1페이지 그림 설명</div>
      </article>
    </section>

    <section class="page">
      <article class="image-card">
        <img src="./b.png" alt="2페이지 그림" />
        <div class="caption">2페이지 그림 설명</div>
      </article>
    </section>

    <section class="page">
      <article class="image-card">
        <img src="./c.png" alt="3페이지 그림" />
        <div class="caption">3페이지 그림 설명</div>
      </article>
    </section>
  </main>
</body>
</html>
